<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="SoundScore — Letterboxd for music">
  <defs>
    <radialGradient id="glow" cx="88%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#1ED760" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#1ED760" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1ED760" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="92%" r="42%">
      <stop offset="0%" stop-color="#B388FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B388FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="albumArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="55%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .tagline{font:600 14px "SF Pro Display","Inter",system-ui,sans-serif;fill:#1ED760;letter-spacing:.22em}
      .wordmark{font:800 108px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3;letter-spacing:-.04em}
      .sub{font:italic 300 34px "SF Pro Display","Inter",Georgia,serif;fill:#B7C3BC;letter-spacing:-.01em}
      .desc{font:400 16px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
      .statNum{font:700 30px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .statLbl{font:600 10.5px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5;letter-spacing:.14em}
      .statSub{font:500 11px "SF Pro Text","Inter",system-ui,sans-serif;fill:#7E8C85}
      .chip{font:600 11.5px "SF Mono","JetBrains Mono",ui-monospace,monospace;fill:#D4DCD7;letter-spacing:.05em}
      .albumTitle{font:700 20px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .albumArtist{font:500 13px "SF Pro Text","Inter",system-ui,sans-serif;fill:#B7C3BC}
      .rating{font:700 28px "SF Pro Display","Inter",system-ui,sans-serif;fill:#1ED760}
      .feedName{font:600 11.5px "SF Pro Text","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .feedMeta{font:500 10.5px "SF Pro Text","Inter",system-ui,sans-serif;fill:#7E8C85}
    </style>
  </defs>

  <!-- Base -->
  <rect width="1400" height="600" fill="#020A04"/>
  <rect width="1400" height="600" fill="url(#glow)"/>
  <rect width="1400" height="600" fill="url(#glow2)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.06" fill="#1ED760">
    <circle cx="80" cy="80" r="1.2"/><circle cx="180" cy="80" r="1.2"/><circle cx="280" cy="80" r="1.2"/>
    <circle cx="80" cy="180" r="1.2"/><circle cx="180" cy="180" r="1.2"/><circle cx="280" cy="180" r="1.2"/>
  </g>

  <!-- ═══════════ LEFT CONTENT ═══════════ -->
  <g transform="translate(72,110)">
    <text class="tagline">LETTERBOXD · FOR · MUSIC</text>
    <text class="wordmark" y="84">SoundScore</text>
    <text class="sub" y="138">rate · review · discover · share</text>
    <text class="desc" y="185">Cross-platform music logging and social discovery,</text>
    <text class="desc" y="207">native on iOS + Android, backed by a single TypeScript API.</text>

    <!-- Stat pills -->
    <g transform="translate(0,248)">
      <rect width="168" height="88" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="statNum" x="20" y="40">36</text>
      <text class="statLbl" x="20" y="60">API ROUTES</text>
      <text class="statSub" x="20" y="76">11 domain modules</text>

      <g transform="translate(184,0)">
        <rect width="168" height="88" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="statNum" x="20" y="40">2</text>
        <text class="statLbl" x="20" y="60">NATIVE CLIENTS</text>
        <text class="statSub" x="20" y="76">SwiftUI · Jetpack Compose</text>
      </g>

      <g transform="translate(368,0)">
        <rect width="168" height="88" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
        <text class="statNum" x="20" y="40">6</text>
        <text class="statLbl" x="20" y="60">COLOR THEMES</text>
        <text class="statSub" x="20" y="76">Emerald · Amethyst · +4</text>
      </g>
    </g>

    <!-- Tech chips -->
    <g transform="translate(0,370)">
      <g>
        <rect width="78" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#1ED76055"/>
        <text class="chip" x="39" y="18" text-anchor="middle">Kotlin</text>
      </g>
      <g transform="translate(86,0)">
        <rect width="80" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#1ED76055"/>
        <text class="chip" x="40" y="18" text-anchor="middle">SwiftUI</text>
      </g>
      <g transform="translate(174,0)">
        <rect width="78" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#1ED76055"/>
        <text class="chip" x="39" y="18" text-anchor="middle">Fastify</text>
      </g>
      <g transform="translate(260,0)">
        <rect width="98" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#1ED76055"/>
        <text class="chip" x="49" y="18" text-anchor="middle">PostgreSQL</text>
      </g>
      <g transform="translate(366,0)">
        <rect width="64" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#1ED76055"/>
        <text class="chip" x="32" y="18" text-anchor="middle">Redis</text>
      </g>
      <g transform="translate(438,0)">
        <rect width="78" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#B388FF55"/>
        <text class="chip" x="39" y="18" text-anchor="middle">Gemini</text>
      </g>
      <g transform="translate(524,0)">
        <rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#FFA72655"/>
        <text class="chip" x="31" y="18" text-anchor="middle">Zod</text>
      </g>
    </g>
  </g>

  <!-- ═══════════ RIGHT: PRODUCT CARD ═══════════ -->
  <g transform="translate(830,92)" filter="url(#lift)">
    <!-- Phone / card shell -->
    <rect width="500" height="420" rx="32" fill="#0A2A18" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="1" y="1" width="498" height="418" rx="31" fill="none" stroke="#1ED760" stroke-opacity="0.18"/>

    <!-- Status strip -->
    <rect x="24" y="22" width="6" height="6" rx="3" fill="#1ED760"/>
    <text x="40" y="30" style="font:600 11px 'SF Pro Text','Inter',system-ui;fill:#1ED760;letter-spacing:.14em">NOW PLAYING</text>
    <text x="464" y="30" text-anchor="end" style="font:500 11px 'SF Mono',ui-monospace;fill:#7E8C85">★ 5.0</text>

    <!-- Album art -->
    <rect x="24" y="52" width="180" height="180" rx="14" fill="url(#albumArt)"/>
    <g transform="translate(24,52)" opacity="0.3">
      <circle cx="90" cy="90" r="58" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="28" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="6" fill="#ffffff"/>
    </g>

    <!-- Metadata -->
    <text x="224" y="74" class="albumTitle">In Rainbows</text>
    <text x="224" y="96" class="albumArtist">Radiohead · 2007 · Alt rock</text>

    <!-- Rating -->
    <g transform="translate(224,116)">
      <text class="rating">5.0</text>
      <g transform="translate(58,-20)" fill="#1ED760">
        <path d="M0 10 l3 -6 l3 6 l6 1 l-4.5 4.5 l1 6.5 l-5.5 -3 l-5.5 3 l1 -6.5 l-4.5 -4.5 z" transform="scale(0.9)"/>
        <path d="M0 10 l3 -6 l3 6 l6 1 l-4.5 4.5 l1 6.5 l-5.5 -3 l-5.5 3 l1 -6.5 l-4.5 -4.5 z" transform="translate(20,0) scale(0.9)"/>
        <path d="M0 10 l3 -6 l3 6 l6 1 l-4.5 4.5 l1 6.5 l-5.5 -3 l-5.5 3 l1 -6.5 l-4.5 -4.5 z" transform="translate(40,0) scale(0.9)"/>
        <path d="M0 10 l3 -6 l3 6 l6 1 l-4.5 4.5 l1 6.5 l-5.5 -3 l-5.5 3 l1 -6.5 l-4.5 -4.5 z" transform="translate(60,0) scale(0.9)"/>
        <path d="M0 10 l3 -6 l3 6 l6 1 l-4.5 4.5 l1 6.5 l-5.5 -3 l-5.5 3 l1 -6.5 l-4.5 -4.5 z" transform="translate(80,0) scale(0.9)"/>
      </g>
      <text x="0" y="30" style="font:500 11px 'SF Pro Text',Inter,system-ui;fill:#9EACA5">0–6 half-star · your log · 2h ago</text>
    </g>

    <!-- Review snippet -->
    <g transform="translate(224,172)">
      <rect width="252" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="12" y="20" style="font:italic 400 11.5px 'SF Pro Text',Georgia,serif;fill:#B7C3BC">
        <tspan x="12" dy="0">"Still the one that breaks me.</tspan>
        <tspan x="12" dy="15">Reckoner on repeat for a decade."</tspan>
      </text>
      <text x="12" y="53" style="font:500 10.5px 'SF Mono',ui-monospace;fill:#7E8C85">— YOUR REVIEW · ✎ EDIT</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="258" x2="476" y2="258" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="282" style="font:600 10.5px 'SF Pro Text',Inter;fill:#7E8C85;letter-spacing:.16em">FROM YOUR FEED</text>

    <!-- Feed rows -->
    <g transform="translate(24,298)">
      <!-- row 1 -->
      <circle cx="18" cy="18" r="15" fill="#FF6B8A"/>
      <text x="18" y="23" text-anchor="middle" style="font:700 12px 'SF Pro Display',Inter;fill:#ffffff">M</text>
      <text x="44" y="15" class="feedName">@meghaa rated ★ 4.5</text>
      <text x="44" y="30" class="feedMeta">Blonde · Frank Ocean · 18m ago</text>
      <rect x="420" y="4" width="40" height="28" rx="6" fill="url(#albumArt)" opacity="0.9"/>

      <!-- row 2 -->
      <circle cx="18" cy="58" r="15" fill="#4FC3F7"/>
      <text x="18" y="63" text-anchor="middle" style="font:700 12px 'SF Pro Display',Inter;fill:#020A04">J</text>
      <text x="44" y="55" class="feedName">@jules added to "Rainy Saturday"</text>
      <text x="44" y="70" class="feedMeta">6 albums · curated list · 44m ago</text>
      <rect x="420" y="44" width="40" height="28" rx="6" fill="#B388FF" opacity="0.8"/>

      <!-- row 3 -->
      <circle cx="18" cy="98" r="15" fill="#FFA726"/>
      <text x="18" y="103" text-anchor="middle" style="font:700 12px 'SF Pro Display',Inter;fill:#020A04">K</text>
      <text x="44" y="95" class="feedName">@kenji reviewed "The Money Store"</text>
      <text x="44" y="110" class="feedMeta">"Loud as hell, loud on purpose" · 2h</text>
      <rect x="420" y="84" width="40" height="28" rx="6" fill="#FF6B6B" opacity="0.8"/>
    </g>
  </g>
</svg>
