<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="SoundScore capabilities">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2D6A4F"/><stop offset="100%" stop-color="#1ED760"/></linearGradient>
    <linearGradient id="g-amethyst" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7B2CBF"/><stop offset="100%" stop-color="#B388FF"/></linearGradient>
    <linearGradient id="g-bonfire" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E76F51"/><stop offset="100%" stop-color="#FFA726"/></linearGradient>
    <linearGradient id="g-rose" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E63946"/><stop offset="100%" stop-color="#FF6B8A"/></linearGradient>
    <linearGradient id="g-midnight" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1D3557"/><stop offset="100%" stop-color="#4FC3F7"/></linearGradient>
    <linearGradient id="g-gilt" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B8860B"/><stop offset="100%" stop-color="#FFD54F"/></linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .tag{font:700 10.5px "SF Pro Text","Inter",ui-monospace,monospace;letter-spacing:.18em}
      .title{font:700 19px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .desc{font:400 12.5px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
      .mono{font:500 10.5px "SF Mono",ui-monospace,monospace;fill:#B7C3BC}
      .sectionH{font:800 28px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3;letter-spacing:-.02em}
      .sectionSub{font:400 14px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#020A04"/>

  <!-- Header -->
  <text class="sectionH" x="48" y="56">Capabilities</text>
  <text class="sectionSub" x="48" y="82">Everything that actually ships today — across iOS, Android, and the backend.</text>

  <!-- ════════ ROW 1 ════════ -->
  <!-- Card 1: Rate & review -->
  <g transform="translate(48,120)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#1ED760">LOG · RATE · REVIEW</text>
    <text class="title" x="24" y="62">0–6 with half-star precision</text>
    <text class="desc" x="24" y="86">Fine-grained ratings · editable reviews ·</text>
    <text class="desc" x="24" y="102">optimistic concurrency on every edit.</text>

    <!-- Rating viz -->
    <g transform="translate(24,130)">
      <rect width="312" height="164" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <!-- album chip -->
      <rect x="20" y="20" width="60" height="60" rx="8" fill="url(#g-amethyst)"/>
      <text x="94" y="36" class="title" style="font-size:14px">In Rainbows</text>
      <text x="94" y="52" class="desc" style="font-size:11px">Radiohead · 2007</text>
      <!-- 0-6 star bar -->
      <text x="94" y="76" class="mono">★ 5.0</text>
      <g transform="translate(20,96)">
        <!-- 12 half-increments from 0 to 6 -->
        <rect x="0" y="0" width="272" height="12" rx="6" fill="#0A2A18"/>
        <rect x="0" y="0" width="226" height="12" rx="6" fill="#1ED760"/>
        <g stroke="#020A04" stroke-width="1.2">
          <line x1="23" y1="0" x2="23" y2="12"/>
          <line x1="46" y1="0" x2="46" y2="12"/>
          <line x1="68" y1="0" x2="68" y2="12"/>
          <line x1="91" y1="0" x2="91" y2="12"/>
          <line x1="113" y1="0" x2="113" y2="12"/>
          <line x1="136" y1="0" x2="136" y2="12"/>
          <line x1="159" y1="0" x2="159" y2="12"/>
          <line x1="181" y1="0" x2="181" y2="12"/>
          <line x1="204" y1="0" x2="204" y2="12"/>
          <line x1="226" y1="0" x2="226" y2="12"/>
          <line x1="249" y1="0" x2="249" y2="12"/>
        </g>
      </g>
      <text x="20" y="134" class="mono" style="font-size:10px">0</text>
      <text x="288" y="134" class="mono" style="font-size:10px" text-anchor="end">6.0</text>
      <text x="20" y="150" style="font:italic 400 11px 'SF Pro Text',Georgia,serif;fill:#B7C3BC">"Still the one that breaks me."</text>
    </g>
  </g>

  <!-- Card 2: Social feed -->
  <g transform="translate(420,120)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#FF6B8A">SOCIAL · FEED</text>
    <text class="title" x="24" y="62">Follow friends · react · comment</text>
    <text class="desc" x="24" y="86">Redis-fanned feed across ratings, reviews,</text>
    <text class="desc" x="24" y="102">new follows, and list activity.</text>

    <g transform="translate(24,130)">
      <!-- 3 feed rows -->
      <g>
        <rect width="312" height="48" rx="10" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="26" cy="24" r="14" fill="url(#g-rose)"/>
        <text x="26" y="29" text-anchor="middle" style="font:700 11px 'SF Pro Display',Inter;fill:#ffffff">M</text>
        <text x="50" y="22" class="title" style="font-size:12px">@meghaa rated ★ 4.5</text>
        <text x="50" y="38" class="desc" style="font-size:10.5px">Blonde · Frank Ocean</text>
        <rect x="272" y="10" width="28" height="28" rx="4" fill="url(#g-amethyst)"/>
      </g>
      <g transform="translate(0,58)">
        <rect width="312" height="48" rx="10" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="26" cy="24" r="14" fill="url(#g-midnight)"/>
        <text x="26" y="29" text-anchor="middle" style="font:700 11px 'SF Pro Display',Inter;fill:#020A04">J</text>
        <text x="50" y="22" class="title" style="font-size:12px">@jules added to "Rainy Sat"</text>
        <text x="50" y="38" class="desc" style="font-size:10.5px">6 albums · curated list</text>
        <rect x="272" y="10" width="28" height="28" rx="4" fill="url(#g-midnight)"/>
      </g>
      <g transform="translate(0,116)">
        <rect width="312" height="48" rx="10" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="26" cy="24" r="14" fill="url(#g-bonfire)"/>
        <text x="26" y="29" text-anchor="middle" style="font:700 11px 'SF Pro Display',Inter;fill:#020A04">K</text>
        <text x="50" y="22" class="title" style="font-size:12px">@kenji ♥ your review</text>
        <text x="50" y="38" class="desc" style="font-size:10.5px">"Loud as hell, loud on purpose"</text>
        <rect x="272" y="10" width="28" height="28" rx="4" fill="url(#g-bonfire)"/>
      </g>
    </g>
  </g>

  <!-- Card 3: Discover -->
  <g transform="translate(792,120)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#4FC3F7">DISCOVER</text>
    <text class="title" x="24" y="62">Genre browse · search · trending</text>
    <text class="desc" x="24" y="86">Postgres full-text (tsvector + GIN)</text>
    <text class="desc" x="24" y="102">powered search in &lt;90ms p95.</text>

    <!-- Genre tiles -->
    <g transform="translate(24,130)">
      <g><rect width="98" height="50" rx="10" fill="url(#g-amethyst)"/><text x="49" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#ffffff">Indie</text></g>
      <g transform="translate(108,0)"><rect width="98" height="50" rx="10" fill="url(#g-bonfire)"/><text x="49" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#020A04">Hip Hop</text></g>
      <g transform="translate(216,0)"><rect width="96" height="50" rx="10" fill="url(#g-emerald)"/><text x="48" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#020A04">Jazz</text></g>

      <g transform="translate(0,60)"><rect width="98" height="50" rx="10" fill="url(#g-midnight)"/><text x="49" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#ffffff">Ambient</text></g>
      <g transform="translate(108,60)"><rect width="98" height="50" rx="10" fill="url(#g-rose)"/><text x="49" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#ffffff">Pop</text></g>
      <g transform="translate(216,60)"><rect width="96" height="50" rx="10" fill="url(#g-gilt)"/><text x="48" y="30" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#020A04">Soul</text></g>
    </g>

    <!-- Search bar mock -->
    <g transform="translate(24,260)">
      <rect width="312" height="36" rx="10" fill="#061A10" stroke="#1ED76044"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#1ED760" stroke-width="1.6"/>
      <line x1="24" y1="22" x2="30" y2="28" stroke="#1ED760" stroke-width="1.6"/>
      <text x="42" y="22" class="mono">blonde frank ocean_</text>
      <rect x="260" y="10" width="44" height="16" rx="4" fill="#1ED76022"/>
      <text x="282" y="21" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#1ED760">GIN+FTS</text>
    </g>
  </g>

  <!-- ════════ ROW 2 ════════ -->
  <!-- Card 4: Lists -->
  <g transform="translate(48,462)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#FFA726">CURATED LISTS</text>
    <text class="title" x="24" y="62">Build · share · collaborate</text>
    <text class="desc" x="24" y="86">Your own collections. Public or private.</text>
    <text class="desc" x="24" y="102">Ordered, covered, and shareable.</text>

    <!-- Stacked list card -->
    <g transform="translate(24,130)">
      <rect width="312" height="164" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="28" class="title" style="font-size:14px">Rainy Saturday</text>
      <text x="20" y="44" class="desc" style="font-size:10.5px">6 albums · @jules · public</text>

      <g transform="translate(20,58)">
        <rect width="42" height="42" rx="6" fill="url(#g-midnight)"/>
        <rect x="48" width="42" height="42" rx="6" fill="url(#g-amethyst)"/>
        <rect x="96" width="42" height="42" rx="6" fill="url(#g-rose)"/>
        <rect x="144" width="42" height="42" rx="6" fill="url(#g-emerald)"/>
        <rect x="192" width="42" height="42" rx="6" fill="url(#g-bonfire)"/>
        <rect x="240" y="0" width="42" height="42" rx="6" fill="#0A2A18" stroke="#1ED76055" stroke-dasharray="3 3"/>
        <text x="261" y="28" text-anchor="middle" style="font:700 16px 'SF Pro Display',Inter;fill:#1ED760">+</text>
      </g>

      <g transform="translate(20,114)">
        <rect width="96" height="26" rx="13" fill="#1ED76022"/>
        <text x="48" y="17" text-anchor="middle" style="font:600 10.5px 'SF Mono',ui-monospace;fill:#1ED760">+ ADD ALBUM</text>
        <rect x="106" width="72" height="26" rx="13" fill="#ffffff" fill-opacity="0.06"/>
        <text x="142" y="17" text-anchor="middle" style="font:600 10.5px 'SF Mono',ui-monospace;fill:#B7C3BC">SHARE</text>
      </g>
    </g>
  </g>

  <!-- Card 5: Recaps -->
  <g transform="translate(420,462)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#B388FF">WEEKLY RECAPS</text>
    <text class="title" x="24" y="62">Auto-generated listening insights</text>
    <text class="desc" x="24" y="86">Every week, a recap of what you rated,</text>
    <text class="desc" x="24" y="102">loved, and who you followed.</text>

    <!-- Recap card -->
    <g transform="translate(24,130)">
      <rect width="312" height="164" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="20" y="28" class="tag" fill="#B388FF">WEEK · APR 9 – APR 15</text>
      <text x="20" y="54" class="title" style="font-size:16px">Your week in sound</text>

      <!-- mini stats -->
      <g transform="translate(20,72)">
        <text style="font:700 22px 'SF Pro Display',Inter;fill:#F2F5F3">14</text>
        <text y="16" style="font:500 9.5px 'SF Mono',ui-monospace;fill:#9EACA5;letter-spacing:.1em">ALBUMS</text>
      </g>
      <g transform="translate(90,72)">
        <text style="font:700 22px 'SF Pro Display',Inter;fill:#F2F5F3">4.2</text>
        <text y="16" style="font:500 9.5px 'SF Mono',ui-monospace;fill:#9EACA5;letter-spacing:.1em">AVG ★</text>
      </g>
      <g transform="translate(170,72)">
        <text style="font:700 22px 'SF Pro Display',Inter;fill:#F2F5F3">3</text>
        <text y="16" style="font:500 9.5px 'SF Mono',ui-monospace;fill:#9EACA5;letter-spacing:.1em">NEW FOLLOWS</text>
      </g>

      <!-- top album -->
      <g transform="translate(20,108)">
        <rect width="40" height="40" rx="6" fill="url(#g-bonfire)"/>
        <text x="50" y="14" class="title" style="font-size:12px">Top album · In Rainbows</text>
        <text x="50" y="30" class="desc" style="font-size:10.5px">Rated 3 times · replay your #1</text>
      </g>
    </g>
  </g>

  <!-- Card 6: AI + Themes -->
  <g transform="translate(792,462)" filter="url(#lift)">
    <rect width="360" height="320" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="tag" x="24" y="36" fill="#FFD54F">GEMINI · AI</text>
    <text class="title" x="24" y="62">Recommendations + 6 themes</text>
    <text class="desc" x="24" y="86">Gemini-powered suggestions. Pick a</text>
    <text class="desc" x="24" y="102">theme. The whole app reskins.</text>

    <!-- Recommendation pill list -->
    <g transform="translate(24,130)">
      <rect width="312" height="76" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="22" class="tag" fill="#FFD54F">RECOMMENDED FOR YOU</text>
      <g transform="translate(16,32)">
        <rect width="28" height="28" rx="4" fill="url(#g-gilt)"/>
        <text x="36" y="14" class="title" style="font-size:11.5px">Illinois · Sufjan Stevens</text>
        <text x="36" y="28" class="desc" style="font-size:10px">because you rated Blonde ★ 4.5</text>
      </g>
    </g>

    <!-- 6 theme swatches -->
    <g transform="translate(24,220)">
      <text class="tag" fill="#9EACA5" style="letter-spacing:.16em">THEMES</text>
      <g transform="translate(0,12)">
        <g><rect width="48" height="48" rx="10" fill="url(#g-emerald)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">EMERALD</text></g>
        <g transform="translate(54,0)"><rect width="48" height="48" rx="10" fill="url(#g-amethyst)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">AMETHYST</text></g>
        <g transform="translate(108,0)"><rect width="48" height="48" rx="10" fill="url(#g-bonfire)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">BONFIRE</text></g>
        <g transform="translate(162,0)"><rect width="48" height="48" rx="10" fill="url(#g-rose)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">ROSE</text></g>
        <g transform="translate(216,0)"><rect width="48" height="48" rx="10" fill="url(#g-midnight)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">MIDNIGHT</text></g>
        <g transform="translate(270,0)"><rect width="48" height="48" rx="10" fill="url(#g-gilt)"/><text x="24" y="68" text-anchor="middle" style="font:600 9px 'SF Mono',ui-monospace;fill:#B7C3BC">GILT</text></g>
      </g>
    </g>
  </g>
</svg>
