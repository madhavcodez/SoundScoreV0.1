<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-label="SoundScore architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1ED76099"/>
    </marker>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="apiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ED76018"/>
      <stop offset="100%" stop-color="#1ED76005"/>
    </linearGradient>
    <filter id="lift">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .stage{font:700 12px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .stageTag{font:700 9.5px "SF Mono",ui-monospace,monospace;letter-spacing:.14em}
      .stageSub{font:500 10px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
      .mono{font:500 10px "SF Mono",ui-monospace,monospace;fill:#B7C3BC}
    </style>
  </defs>

  <rect width="1400" height="400" fill="#020A04"/>

  <!-- ═══ CLIENTS (left) ═══ -->
  <g transform="translate(60,80)" filter="url(#lift)">
    <rect width="220" height="240" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect width="220" height="28" rx="18" fill="#1ED76018"/>
    <rect y="16" width="220" height="12" fill="#1ED76018"/>
    <text class="stageTag" x="16" y="19" fill="#1ED760">CLIENTS · NATIVE</text>

    <!-- iOS row -->
    <g transform="translate(16,44)">
      <rect width="188" height="80" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="14" y="14" width="28" height="52" rx="6" fill="#F2F5F3" fill-opacity="0.06" stroke="#4FC3F755"/>
      <rect x="18" y="18" width="20" height="44" rx="3" fill="#4FC3F722"/>
      <text x="52" y="30" class="stage">iOS · SwiftUI</text>
      <text x="52" y="46" class="stageSub">Combine · URLSession</text>
      <text x="52" y="60" class="mono">10 screens</text>
    </g>

    <!-- Android row -->
    <g transform="translate(16,136)">
      <rect width="188" height="80" rx="12" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="14" y="14" width="28" height="52" rx="6" fill="#F2F5F3" fill-opacity="0.06" stroke="#1ED76055"/>
      <rect x="18" y="18" width="20" height="44" rx="3" fill="#1ED76022"/>
      <text x="52" y="30" class="stage">Android · Compose</text>
      <text x="52" y="46" class="stageSub">StateFlow · Hilt · Room</text>
      <text x="52" y="60" class="mono">OkHttp</text>
    </g>
  </g>

  <!-- Arrows clients → API -->
  <line x1="280" y1="140" x2="430" y2="175" stroke="#1ED76099" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="280" y1="260" x2="430" y2="225" stroke="#1ED76099" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="355" y="155" class="mono" text-anchor="middle" style="fill:#7E8C85;font-size:9px">HTTPS · /v1/*</text>

  <!-- ═══ API (center) ═══ -->
  <g transform="translate(440,50)" filter="url(#lift)">
    <rect width="380" height="300" rx="20" fill="url(#apiCard)" stroke="#1ED76055"/>
    <rect width="380" height="30" rx="20" fill="#1ED76030"/>
    <rect y="16" width="380" height="14" fill="#1ED76030"/>
    <text class="stageTag" x="20" y="20" fill="#1ED760">API · ORCHESTRATION</text>
    <text class="stage" x="20" y="60" style="font-size:18px">Fastify 4.x · TypeScript</text>
    <text class="stageSub" x="20" y="80">36 routes · Pino logs · Zod validation</text>

    <!-- 11 module chips in 3 rows -->
    <g transform="translate(16,100)">
      <g><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">auth</text></g>
      <g transform="translate(118,0)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">catalog</text></g>
      <g transform="translate(236,0)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">opinions</text></g>

      <g transform="translate(0,34)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">social</text></g>
      <g transform="translate(118,34)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">lists</text></g>
      <g transform="translate(236,34)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">recaps</text></g>

      <g transform="translate(0,68)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">push</text></g>
      <g transform="translate(118,68)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">import</text></g>
      <g transform="translate(236,68)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">providers</text></g>

      <g transform="translate(59,102)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">mapping</text></g>
      <g transform="translate(177,102)"><rect width="110" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#1ED76044"/><text x="55" y="17" text-anchor="middle" class="mono">trust</text></g>
    </g>

    <!-- Shared contracts footer -->
    <g transform="translate(16,250)">
      <rect width="348" height="34" rx="8" fill="#020A04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="21" class="mono" style="fill:#FFA726">packages/contracts</text>
      <text x="142" y="21" class="mono" style="fill:#7E8C85">shared Zod schemas · idempotency keys</text>
    </g>
  </g>

  <!-- Arrows API → backends -->
  <line x1="820" y1="130" x2="960" y2="105" stroke="#1ED76099" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="200" x2="960" y2="200" stroke="#1ED76099" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="270" x2="960" y2="295" stroke="#1ED76099" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ═══ DATA (right) ═══ -->
  <g transform="translate(970,70)" filter="url(#lift)">
    <!-- Postgres -->
    <rect width="360" height="72" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(18,16)">
      <ellipse cx="20" cy="10" rx="18" ry="6" fill="#4FC3F7" fill-opacity="0.22" stroke="#4FC3F7"/>
      <path d="M2 10 v20 a18 6 0 0 0 36 0 v-20" fill="#4FC3F7" fill-opacity="0.14" stroke="#4FC3F7"/>
      <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#4FC3F7" stroke-opacity="0.5"/>
    </g>
    <text class="stage" x="72" y="34">PostgreSQL 15</text>
    <text class="stageSub" x="72" y="52">tsvector · GIN indexes · p95 &lt;90ms</text>

    <!-- Redis -->
    <g transform="translate(0,96)">
      <rect width="360" height="72" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <g transform="translate(20,22)">
        <rect width="40" height="6" rx="2" fill="#FF6B6B"/>
        <rect y="10" width="40" height="6" rx="2" fill="#FF6B6B" fill-opacity="0.6"/>
        <rect y="20" width="40" height="6" rx="2" fill="#FF6B6B" fill-opacity="0.3"/>
      </g>
      <text class="stage" x="72" y="34">Redis</text>
      <text class="stageSub" x="72" y="52">feed fan-out · sessions · rate limit</text>
    </g>

    <!-- External (Spotify + MusicBrainz + Gemini) -->
    <g transform="translate(0,192)">
      <rect width="360" height="88" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="stageTag" x="18" y="22" fill="#B388FF">EXTERNAL PROVIDERS</text>

      <g transform="translate(18,34)">
        <rect width="100" height="22" rx="11" fill="#1ED76022" stroke="#1ED76055"/>
        <text x="50" y="15" text-anchor="middle" class="mono" style="fill:#1ED760;font-size:10px">Spotify OAuth</text>
      </g>
      <g transform="translate(124,34)">
        <rect width="112" height="22" rx="11" fill="#FFA72622" stroke="#FFA72655"/>
        <text x="56" y="15" text-anchor="middle" class="mono" style="fill:#FFA726;font-size:10px">MusicBrainz</text>
      </g>
      <g transform="translate(242,34)">
        <rect width="100" height="22" rx="11" fill="#B388FF22" stroke="#B388FF55"/>
        <text x="50" y="15" text-anchor="middle" class="mono" style="fill:#B388FF;font-size:10px">Gemini</text>
      </g>
      <text x="18" y="74" class="stageSub">canonical mapping · recs · enrichment</text>
    </g>
  </g>
</svg>
