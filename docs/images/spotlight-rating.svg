<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Rating spotlight — 0-6 scale with half-star precision">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="album" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="55%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#1ED760" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1ED760" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .h{font:800 26px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3;letter-spacing:-.02em}
      .sub{font:400 13px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
      .tag{font:700 10px "SF Mono",ui-monospace,monospace;letter-spacing:.18em}
      .lbl{font:600 10.5px "SF Pro Text","Inter",system-ui,sans-serif;fill:#7E8C85;letter-spacing:.14em}
      .val{font:700 30px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .albumTitle{font:700 18px "SF Pro Display","Inter",system-ui,sans-serif;fill:#F2F5F3}
      .albumMeta{font:400 12px "SF Pro Text","Inter",system-ui,sans-serif;fill:#9EACA5}
      .mono{font:500 11px "SF Mono",ui-monospace,monospace;fill:#B7C3BC}
    </style>
  </defs>

  <rect width="1200" height="440" fill="#020A04"/>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <!-- Header -->
  <text class="tag" x="48" y="42" fill="#1ED760">SPOTLIGHT · RATING</text>
  <text class="h" x="48" y="74">A real rating system · not five stars</text>
  <text class="sub" x="48" y="96">13 increments from 0.0 to 6.0 · every half-star matters · every edit is an opinion_version bump.</text>

  <!-- ═══ LEFT: Rating interface ═══ -->
  <g transform="translate(48,130)" filter="url(#lift)">
    <rect width="720" height="280" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>

    <!-- Album art + meta -->
    <rect x="28" y="28" width="140" height="140" rx="12" fill="url(#album)"/>
    <g transform="translate(28,28)" opacity="0.3">
      <circle cx="70" cy="70" r="48" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="22" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="5" fill="#ffffff"/>
    </g>

    <text x="192" y="50" class="albumTitle" style="font-size:22px">To Pimp a Butterfly</text>
    <text x="192" y="76" class="albumMeta">Kendrick Lamar · 2015 · Hip Hop</text>
    <g transform="translate(192,92)">
      <rect width="58" height="22" rx="11" fill="#1ED76022" stroke="#1ED76055"/>
      <text x="29" y="15" text-anchor="middle" class="mono" style="font-size:10px;fill:#1ED760">LOGGED</text>
      <rect x="66" width="78" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="105" y="15" text-anchor="middle" class="mono" style="font-size:10px;fill:#B7C3BC">2H AGO</text>
    </g>

    <!-- The 0-6 scale viz -->
    <g transform="translate(28,200)">
      <text x="0" y="-12" class="lbl">YOUR RATING · 13 HALF-STAR INCREMENTS</text>

      <!-- baseline track -->
      <rect width="664" height="16" rx="8" fill="#0A2A18"/>
      <!-- fill up to 5.0 / 6 -->
      <rect width="553" height="16" rx="8" fill="#1ED760"/>
      <!-- 12 tick divisions -->
      <g stroke="#020A04" stroke-width="1.2">
        <line x1="55" y1="0" x2="55" y2="16"/>
        <line x1="111" y1="0" x2="111" y2="16"/>
        <line x1="166" y1="0" x2="166" y2="16"/>
        <line x1="221" y1="0" x2="221" y2="16"/>
        <line x1="277" y1="0" x2="277" y2="16"/>
        <line x1="332" y1="0" x2="332" y2="16"/>
        <line x1="387" y1="0" x2="387" y2="16"/>
        <line x1="443" y1="0" x2="443" y2="16"/>
        <line x1="498" y1="0" x2="498" y2="16"/>
        <line x1="553" y1="0" x2="553" y2="16"/>
        <line x1="609" y1="0" x2="609" y2="16"/>
      </g>
      <!-- thumb at 5.0 -->
      <g transform="translate(553,8)">
        <circle r="10" fill="#F2F5F3" stroke="#1ED760" stroke-width="2"/>
        <text y="-16" text-anchor="middle" style="font:700 13px 'SF Pro Display',Inter;fill:#1ED760">5.0</text>
      </g>

      <!-- scale labels -->
      <g transform="translate(0,38)" class="mono" style="font-size:9.5px;fill:#7E8C85">
        <text x="0" text-anchor="start">0</text>
        <text x="111" text-anchor="middle">1</text>
        <text x="221" text-anchor="middle">2</text>
        <text x="332" text-anchor="middle">3</text>
        <text x="443" text-anchor="middle">4</text>
        <text x="553" text-anchor="middle">5</text>
        <text x="664" text-anchor="end">6</text>
      </g>
    </g>
  </g>

  <!-- ═══ RIGHT: panel ═══ -->
  <g transform="translate(796,130)" filter="url(#lift)">
    <rect width="356" height="280" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <text class="tag" x="20" y="30" fill="#B388FF">OPTIMISTIC CONCURRENCY</text>

    <!-- card 1 -->
    <g transform="translate(20,50)">
      <rect width="316" height="58" rx="10" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="22" class="lbl">OPINION VERSION</text>
      <text x="14" y="46" class="val" style="font-size:22px">v4</text>
      <text x="60" y="44" class="mono">last edit 2h ago</text>
    </g>

    <!-- card 2: version history -->
    <g transform="translate(20,122)">
      <rect width="316" height="138" rx="10" fill="#061A10" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="22" class="lbl">EDIT HISTORY</text>

      <g transform="translate(14,36)" class="mono">
        <circle cx="6" cy="6" r="3" fill="#1ED760"/>
        <text x="20" y="10" style="fill:#F2F5F3">v4 · ★ 5.0 · "Still the one"</text>
        <text x="240" y="10" style="fill:#7E8C85">2h</text>
      </g>
      <g transform="translate(14,60)" class="mono">
        <circle cx="6" cy="6" r="3" fill="#FFA726"/>
        <text x="20" y="10" style="fill:#B7C3BC">v3 · ★ 4.5</text>
        <text x="240" y="10" style="fill:#7E8C85">3d</text>
      </g>
      <g transform="translate(14,84)" class="mono">
        <circle cx="6" cy="6" r="3" fill="#B388FF"/>
        <text x="20" y="10" style="fill:#B7C3BC">v2 · ★ 4.0</text>
        <text x="240" y="10" style="fill:#7E8C85">2w</text>
      </g>
      <g transform="translate(14,108)" class="mono">
        <circle cx="6" cy="6" r="3" fill="#ffffff" fill-opacity="0.4"/>
        <text x="20" y="10" style="fill:#B7C3BC">v1 · ★ 3.5 · initial log</text>
        <text x="240" y="10" style="fill:#7E8C85">5w</text>
      </g>
    </g>
  </g>
</svg>
