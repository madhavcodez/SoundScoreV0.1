name: CI

on:
  pull_request:
  push:
    branches: [ main, UI_beta ]

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soundscore
          POSTGRES_USER: soundscore
          POSTGRES_PASSWORD: soundscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundscore -d soundscore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://soundscore:soundscore@localhost:5432/soundscore
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Run migrations
        run: npm run migrate --workspace backend

      - name: Typecheck contracts and backend
        run: npm run typecheck

      - name: Backend tests
        run: npm run test --workspace backend

      - name: Build contracts and backend
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest
