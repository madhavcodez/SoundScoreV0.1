services:
  postgres:
    image: postgres:16-alpine
    container_name: soundscore-postgres
    environment:
      POSTGRES_DB: soundscore
      POSTGRES_USER: soundscore
      POSTGRES_PASSWORD: soundscore
    ports:
      - "5432:5432"
    volumes:
      - soundscore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundscore -d soundscore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soundscore-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  soundscore_postgres_data:
